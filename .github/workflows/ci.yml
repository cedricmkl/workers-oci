name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest

    # The end-to-end test pushes and pulls against a real registry rather than a
    # stub, so the distribution API is exercised as written.
    services:
      registry:
        image: registry:2
        ports:
          - 5111:5000

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

      - name: round trip through a registry
        run: |
          set -euo pipefail
          bun run src/cli.ts build \
            --config examples/compose/.artifact/v1/worker-app.json \
            --out /tmp/artifact --version v0.0.0 --created 2026-01-01T00:00:00Z

          digest=$(bun run src/cli.ts push /tmp/artifact localhost:5111/ci/example:v0.0.0)
          bun run src/cli.ts pull "localhost:5111/ci/example:v0.0.0@$digest" --into /tmp/pulled
          bun run src/cli.ts inspect /tmp/pulled >/dev/null

          test -f /tmp/pulled/worker-app.json
          test -f /tmp/pulled/dist/api.js
          test -f /tmp/pulled/migrations/0001_init.sql

          # The chunk both entries import, and the document the build wrote for
          # it. The tar always carried the chunk; what regressed silently was the
          # `modules` entry that tells the deployment to UPLOAD it, and without
          # that the worker dies at its first dynamic import in production.
          test -f /tmp/pulled/dist/chunk-shared.js
          for w in api consumer; do
            jq -e --arg w "$w" \
              '.workers[] | select(.name == $w) | .modules | map(.path) | index("dist/chunk-shared.js")' \
              /tmp/pulled/worker-app.json >/dev/null \
              || { echo "worker $w does not declare the shared chunk"; exit 1; }
          done

      # The build EMITS a document, with `modules` filled in, and that document is
      # what a deployment reads. Only the hand-written source was ever validated,
      # so a build that wrote something schema-invalid passed both jobs.
      - name: the emitted document validates too
        run: |
          set -euo pipefail
          pipx run check-jsonschema --schemafile schema/worker-app.v1.json /tmp/artifact/config.json

      # Two builds in one checkout prove nothing: same directory, same git state,
      # same binary, seconds apart. None of the inputs that actually vary between
      # two people building one commit can move. A second CLONE at a different
      # path, reached over a different remote URL, is the cheapest thing that
      # exercises them, and it is what caught the manifest digest depending on
      # whether the tree came from ssh or https.
      - name: a second clone builds the same bytes
        run: |
          set -euo pipefail
          # ONE repository, TWO ways of naming it. This is the difference the
          # digest used to depend on: an ssh checkout and an https checkout of
          # the same commit pinned different digests for identical content,
          # because the remote URL rides in the manifest as a provenance
          # annotation and was recorded verbatim.
          git clone --quiet . /tmp/second
          git remote set-url origin https://github.com/cedricmkl/workers-oci.git
          git -C /tmp/second remote set-url origin git@github.com:cedricmkl/workers-oci.git

          bun run src/cli.ts build --config examples/compose/.artifact/v1/worker-app.json \
            --out /tmp/a --created 2026-01-01T00:00:00Z >/dev/null
          bun run src/cli.ts build --config /tmp/second/examples/compose/.artifact/v1/worker-app.json \
            --out /tmp/b --created 2026-01-01T00:00:00Z >/dev/null

          # The layer and the config blob, not only the digest that summarises
          # them: a mismatch names which of the three moved.
          cmp /tmp/a/content.tar /tmp/b/content.tar
          cmp /tmp/a/config.json /tmp/b/config.json
          cmp /tmp/a/manifest.json /tmp/b/manifest.json

      # A non-ASCII path is 1 to 4 bytes per character, and the ustar name field
      # is 100 BYTES. Measuring it in JS string length wrote past the field, over
      # mode, uid, gid, size and mtime, and the checksum was computed afterwards
      # so the header came out self-consistent and no reader complained.
      - name: a non-ASCII path round trips through GNU tar
        run: |
          set -euo pipefail
          mkdir -p /tmp/utf8/dist
          printf 'export default {}' > /tmp/utf8/dist/index.js
          printf 'export const x = 1' > "/tmp/utf8/dist/grüße-chunk.js"
          jq -n '{schema_version: 1, name: "utf8",
                  runtime: {compatibility_date: "2026-07-14"},
                  workers: [{name: "utf8", main: "dist/index.js"}]}' > /tmp/utf8/worker-app.json
          bun run src/cli.ts build --config /tmp/utf8/worker-app.json --out /tmp/utf8out \
            --created 2026-01-01T00:00:00Z >/dev/null
          tar tf /tmp/utf8out/content.tar | grep -qx 'dist/grüße-chunk.js'
          jq -e '.workers[0].modules | map(.path) | index("dist/grüße-chunk.js")' \
            /tmp/utf8out/config.json >/dev/null

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema
      - name: the example validates against the schema
        run: |
          check-jsonschema --schemafile schema/worker-app.v1.json \
            examples/compose/.artifact/v1/worker-app.json

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1

      - name: formatting
        run: tofu fmt -check -recursive terraform examples

      - name: validate each module
        run: |
          set -euo pipefail
          for dir in terraform/resources terraform/deploy examples/compose; do
            echo "── $dir"
            tofu -chdir="$dir" init -backend=false -input=false >/dev/null
            tofu -chdir="$dir" validate
          done

      - name: a plan resolves every binding
        env:
          CLOUDFLARE_API_TOKEN: dummy
        run: |
          tofu -chdir=examples/compose plan -input=false -lock=false \
            -var account_id=0000000000000000000000000000000a \
            -var zone_id=0da42c8d2953a72d0c4ffc7b0e26bce3 \
            -var api_key=dummy >/dev/null
