# Build a worker-app artifact and publish it, as a whole job.
#
# THE ACTIONS ARE THE INTERFACE. This is a thin caller of `build` and `push` for
# the case they cover completely: a repository with one bundle command pushing to
# a registry that takes a username and a password. It owns the job, so there is
# nowhere to put a step it did not anticipate.
#
#   jobs:
#     release:
#       uses: cedricmkl/workers-oci/.github/workflows/release.yml@v1
#       permissions: { contents: read, packages: write }
#       with:
#         registry: ghcr.io
#         repository: ${{ github.repository }}
#
# Reach for the actions directly the moment you need a step before the push:
# federating into AWS for ECR, installing a private dependency, bundling with
# something the `build-command` input cannot express.
#
#   - uses: cedricmkl/workers-oci/build@v1
#     with: { version: ${{ github.ref_name }} }
#   - uses: cedricmkl/workers-oci/push@v1
#     with: { reference: ..., password: ... }

name: release

on:
  workflow_call:
    inputs:
      registry:
        description: Registry host, for example ghcr.io or 123.dkr.ecr.eu-central-1.amazonaws.com.
        type: string
        required: true
      repository:
        description: Repository path under the registry.
        type: string
        required: true
      version:
        description: Version to publish. Defaults to the tag that triggered the run.
        type: string
        default: ""
      config:
        description: Path to the config document.
        type: string
        default: worker-app.json
      root:
        description: Directory the document's paths are relative to.
        type: string
        default: ""
      include:
        description: Extra paths to ship, whitespace separated.
        type: string
        default: ""
      build-command:
        description: Command that produces the bundle. Skipped when empty.
        type: string
        default: bun run build
      install-command:
        type: string
        default: bun install --frozen-lockfile
      also-tag:
        description: Extra tags for the same manifest, whitespace separated.
        type: string
        default: ""
      environment:
        type: string
        default: ""
    secrets:
      registry-username:
        description: Defaults to the GitHub actor, which is what ghcr.io expects.
        required: false
      registry-password:
        description: Defaults to GITHUB_TOKEN, which is what ghcr.io expects.
        required: false
    outputs:
      digest:
        description: Manifest digest of the published artifact.
        value: ${{ jobs.release.outputs.digest }}
      version:
        description: Version it was published under.
        value: ${{ jobs.release.outputs.version }}
      reference:
        description: Full reference, tag and digest together.
        value: ${{ jobs.release.outputs.reference }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.build.outputs.version }}
      reference: ${{ steps.push.outputs.reference }}

    steps:
      # Full history, because the artifact records the commit timestamp and two
      # builds of one commit have to agree.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Checked out beside the caller's tree, because the actions run from source
      # and `uses:` alone would not give the workflow a path to them.
      - uses: actions/checkout@v4
        with:
          repository: cedricmkl/workers-oci
          ref: ${{ github.workflow_sha }}
          path: .workers-oci

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - if: inputs.install-command != ''
        run: ${{ inputs.install-command }}

      - if: inputs.build-command != ''
        run: ${{ inputs.build-command }}

      - id: build
        uses: ./.workers-oci/build
        with:
          config: ${{ inputs.config }}
          root: ${{ inputs.root }}
          version: ${{ inputs.version }}
          include: ${{ inputs.include }}
          setup-bun: "false"

      - id: push
        uses: ./.workers-oci/push
        with:
          reference: ${{ inputs.registry }}/${{ inputs.repository }}:${{ steps.build.outputs.version }}
          tags: ${{ inputs.also-tag }}
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-password || secrets.GITHUB_TOKEN }}
          setup-bun: "false"
